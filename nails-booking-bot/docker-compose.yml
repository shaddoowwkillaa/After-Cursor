services:
  db:
    image: postgres:16
    container_name: nails_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nails
      POSTGRES_PASSWORD: nails_dev_password
      POSTGRES_DB: nails_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nails -d nails_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: